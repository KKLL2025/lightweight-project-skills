name: Feature request
description: Propose a focused improvement without making the workflow heavier by default.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - spec-workflow
        - drive-large-project
        - organize-ai-project-files
        - Evaluations
        - Documentation or release engineering
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the observable failure or recurring friction, not only the proposed mechanism.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Smallest useful change
      description: Explain why this belongs in a reusable skill and when it should stay inactive.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or examples
      description: Add prompts, outputs, comparisons, or public references when available.
  - type: checkboxes
    id: principles
    attributes:
      label: Design fit
      options:
        - label: The proposal preserves model autonomy for small, explicit tasks.
          required: true
        - label: The proposal does not require a PRD, fixed phase, or subagent for every task.
          required: true
